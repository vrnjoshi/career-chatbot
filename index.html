<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Varun Joshi Chatbot</title>
  <style>
    body {
      background-color: #f5f5f5;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
    }
    input {
      padding: 12px;
      width: 350px;
      border-radius: 24px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 16px;
    }
    input:focus {
      border-color: #0070f3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ask Me Anything</h1>
    <input type="text" placeholder="Ask about my skills, career, projects..." />
  </div>
</body>
</html>
